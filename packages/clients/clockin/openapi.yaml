        403:
          description: Unauthorized
        422:
          description: "Validation error"
      summary: "Create project"
      tags:
        - Projects
    get:
      operationId: getAListOfProjects
      description: "Get a list of projects"
      parameters:
        - schema:
            type: boolean
          name: with_trashed
          in: query
        - schema:
            type: boolean
          name: only_trashed
          in: query
        - schema:
            type: string
            enum:
              - signed_url
              - employees
              - subProjects
              - customer
              - projectTags
              - signedUrl
              - customFields
          name: include
          in: query
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectResource"
                  links:
                    $ref: "#/components/schemas/ResourceLinks"
                  meta:
                    $ref: "#/components/schemas/ResourceMeta"
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
      summary: "Get a list of projects"
      tags:
        - Projects
  /v3/projects/search:
    post:
      operationId: searchForProjects
      description: "Search for projects"
      parameters:
        - schema:
            type: boolean
          name: with_trashed
          in: query
        - schema:
            type: boolean
          name: only_trashed
          in: query
        - schema:
            type: string
            enum:
              - signed_url
              - employees
              - subProjects
              - customer
              - projectTags
              - signedUrl
              - customFields
          name: include
          in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        enum:
                          - archived
                          - unarchived
                          - completed
                          - uncompleted
                          - byStates
                          - byCreatedAt
                          - byUpdatedAt
                          - byStartDate
                          - byEndDate
                          - byName
                          - byNumber
                          - byCustomer
                          - bySource
                        description: |
                          * archived - Returns only archived projects
                          * unarchived - Returns only unarchived projects
                          * completed - Returns only completed projects
                          * uncompleted - Returns only uncompleted projects
                          * byCreatedAt 
                            * operator ('=', '>', '>=', '<', '<='),
                            * value (ISO8601 string)
                          * byUpdatedAt 
                            * operator ('=', '>', '>=', '<', '<='),
                            * value (ISO8601 string)
                          * byStartDate
                            * operator ('=', '>', '>=', '<', '<='),
                            * value (ISO8601 string)
                          * byEndDate
                            * operator ('=', '>', '>=', '<', '<='),
                            * value (ISO8601 string)
                          * byName
                            * value (string)
                          * byNumber
                            * value (string)
                            * You can use wildcard '*'
                          * byCustomer
                            * value (string)
                          * byStates
                            * values (active, completed, archived) ([string])
                          * bySource
                            * value (string)
                      parameters:
                        type: array
                        items:
                          type: string
                    required:
                      - name
                sort:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        enum:
                          - created_at
                          - updated_at
                          - start_date
                          - end_date
                      direction:
                        type: string
                        enum:
                          - asc
                          - desc
                    required:
                      - field
                includes:
                  type: array
                  items:
                    type: object
                    properties:
                      relation:
                        type: string
                        enum:
                          - employees
                          - subProjects
                          - customer
                          - projectTags
                          - signedUrl
                          - customFields
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectResource"
                  links:
                    $ref: "#/components/schemas/ResourceLinks"
                  meta:
                    $ref: "#/components/schemas/ResourceMeta"
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        422:
          description: "Validation error"
      summary: "Search for projects"
      tags:
        - Projects

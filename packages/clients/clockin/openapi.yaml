openapi: 3.0.3
info:
  title: "clockin API"
  description: |
    The clockin API is designed around [REST](https://en.wikipedia.org/wiki/REST) concepts.  
    It features predictable resource-oriented URLs and  
    uses standard HTTP verbs and response codes.  
    Request and response bodies are JSON-encoded  
    with datetime values in [ISO 8601](https://de.wikipedia.org/wiki/ISO_8601).  

    Requests must use HTTP Bearer Authentication.  
    Admins may generate access tokens with read or  
    write permissions in the [clockin Admin Panel](https://office.clockin.de/port?clockinApi).  

    Requests are rate limited as indicated by **X-Ratelimit-*** HTTP headers per second.
    - **X-RateLimit-Limit** determines the amount of requests within a second until the limit takes effect
    - **X-RateLimit-Remaining** indicates how many requests are still available within the time window


    For filtering in the search Routes you have to pass one or multiple **scopes** in the Request body.

    [API Example Requests](/customer-api/v3/examples)  
    [How to send API Requests with Postman](https://learning.postman.com/docs/getting-started/sending-the-first-request/)  
    - Download and import the [Clockin API Postman Collection](/customer-api/v3/downloads/postman-collection) 
    - Replace the `{{bearerToken}}` in the Authorization Tab
    - Start testing the API
     
    [clockin Website](https://www.clockin.de)
    [Terms of Service](https://www.clockin.de/agb/)
  version: 3.0.0
servers:
  - url: "https://customerapi.clockin.de"
security:
  - BearerAuth: []
paths:
  /v3/projects/custom-fields:
    get:
      operationId: getProjectCustomFields
      description: "Get custom fields configuration for projects"
      responses:

  "/v3/events/{event}":
    delete:
      operationId: deleteEvent
      description: "Delete event"
      parameters:
        - schema:
            type: integer
          name: event
          in: path
          required: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EventResource"
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        404:
          description: "Resource not found"
        422:
          description: "Validation error"
      summary: "Delete event"
      tags:
        - Events
  /v3/travel_logs:
    get:
      operationId: getTravelLogs
      description: "Get a list of all Travel-Logs"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TravelLogResource"
                  links:
                    $ref: "#/components/schemas/ResourceLinks"
                  meta:
                    $ref: "#/components/schemas/ResourceMeta"
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
      summary: "Get a list of TravelLogs"
      tags:
        - "TravelLog"

  /v3/sap_event_logs/search:
    post:
      parameters: []
      description:
        "You will get all time event changes of the selected employee that occurred within the given time period.
        This endpoint can only be requested 180 times a minute for a max time-period (start_date to end_date) of 48 hours"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_id:
                  type: integer
                  example: "12"
                  description: "ID of the employee"
                start_date:
                  type: string
                  format: date-time
                  example: "2023-06-17T18:00:00Z"
                  description: "Date in ISO 8601 format"
                end_date:
                  type: string
                  format: date-time
                  example: "2023-06-17T18:00:00Z"
                  description: "Date in ISO 8601 format"
              required:
                - start_date
                - end_date
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  result:
                    type: object
                    properties:
                      activities:
                        type: array
                        items:
                          $ref: "#/components/schemas/SapEventResource"
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        400:
          description: |
            * code 31 - start_date and end_date are required
            * code 32 - Date-Format not valid
            * code 33 - end_date can not be earlier than start_date
            * code 34 - end_date has to be in the past
            * code 35 - Time-Period can not be longer than 48 hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                  code:
                    type: integer
                  message:
                    type: string

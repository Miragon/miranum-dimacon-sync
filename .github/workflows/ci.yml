name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `drizzle-kit check` validiert nur die Migrations-Snapshots unter-
      # einander — Drift zwischen schema.ts und den Migrationen erkennt erst
      # der generate+diff-Schritt darunter.
      - name: Drizzle migration-history consistency
        run: pnpm exec drizzle-kit check

      - name: Drizzle schema/migration drift check
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain src/server/db/migrations)" ]; then
            echo "::error::schema.ts geändert ohne Migration — pnpm db:generate ausführen und committen"
            git status --porcelain src/server/db/migrations
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

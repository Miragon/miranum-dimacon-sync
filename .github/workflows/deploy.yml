name: Build and Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: prod
            app: miranum-dimacon-sync
            org: miranum
            token_secret: FLY_TOKEN_PROD
            workos_client_id_var: WORKOS_CLIENT_ID_PROD
          - env: stage
            app: miranum-dimacon-sync-stage
            org: miranum-stage
            token_secret: FLY_TOKEN_STAGE
            workos_client_id_var: WORKOS_CLIENT_ID_STAGE
    name: build-and-push (${{ matrix.env }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app if missing
        env:
          FLY_API_TOKEN: ${{ secrets[matrix.token_secret] }}
        run: |
          if ! flyctl status -a "${{ matrix.app }}" >/dev/null 2>&1; then
            flyctl apps create "${{ matrix.app }}" --org "${{ matrix.org }}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly registry
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets[matrix.token_secret] }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # VITE_WORKOS_CLIENT_ID wird von Vite ins Bundle gebakt und MUSS
          # deshalb als Build-Arg kommen. Die Client-ID liegt als
          # GitHub-SECRET je Umgebung (WORKOS_CLIENT_ID_{PROD,STAGE}) —
          # inhaltlich eine Public-Client-ID, aber als Secret gepflegt.
          # Fehlt der Wert, baut das Image ohne Frontend-Auth und der
          # Server-Startup-Guard verhindert den unauthentifizierten
          # Betrieb in Produktion.
          build-args: |
            VITE_WORKOS_CLIENT_ID=${{ secrets[matrix.workos_client_id_var] }}
          tags: |
            registry.fly.io/${{ matrix.app }}:latest
            registry.fly.io/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.env }}
          cache-to: type=gha,mode=max,scope=${{ matrix.env }}

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets[matrix.token_secret] }}
        # Config aus fly.toml (Checkout), Image aus dem Push oben. --ha=false:
        # genau EINE Machine — Scheduler/Mutex sind in-process, eine zweite
        # Machine würde Crons doppelt feuern. Secrets (DATABASE_URL,
        # CREDENTIAL_KEYS, WORKOS_CLIENT_ID, optional WORKOS_API_KEY) müssen
        # vor dem ersten Deploy gesetzt sein, sonst verweigert der
        # Produktions-Guard den Start und der Health-Check lässt den Deploy
        # fehlschlagen.
        run: |
          flyctl deploy -a "${{ matrix.app }}" \
            -i "registry.fly.io/${{ matrix.app }}:${{ github.sha }}" \
            --ha=false --wait-timeout 5m
